spring.application.name=devpulse-ai

# Server
server.port=8081

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/devpulse
spring.datasource.username=devpulse_user
spring.datasource.password=devpulse_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=DevPulseHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# RSS Collection Schedule
devpulse.collection.rss.cron=0 0 */6 * * *
devpulse.collection.rss.time-zone=Asia/Kolkata