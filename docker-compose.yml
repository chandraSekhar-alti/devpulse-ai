services:
  postgres:
    image: postgres:17
    container_name: devpulse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: devpulse
      POSTGRES_USER: devpulse_user
      POSTGRES_PASSWORD: devpulse_dev_password

    ports:
      - "5433:5432"

    volumes:
      - devpulse_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse_user -d devpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devpulse_postgres_data:
